<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Way4Shop</title>
</head>
<body style="background-color: black; margin: 0; padding: 0; color: white; font-family: Arial, sans-serif;">

<div style="text-align: center; padding: 20px; margin-top: 50px;">
    <h1 id="displayShopName" style="color: gold; font-size: 30px;">Loading Shop...</h1>
    <p id="displayTagline" style="font-size: 18px; color: #ccc;"></p>
</div>

<!-- Call Now Button -->
<div style="padding: 10px; text-align: center;">
    <a id="callBtn" href="#" style="text-decoration: none;">
        <button style="background-color: red; width: 90%; height: 50px; font-size: 20px; color: white; border: none; border-radius: 5px; cursor: pointer;">
            <b>Call Now</b>
        </button>
    </a>
</div>

<!-- WhatsApp Button -->
<div style="padding: 10px; text-align: center;">
    <a id="whatsappBtn" href="#" style="text-decoration: none;" target="_blank">
        <button style="background-color: green; width: 90%; height: 50px; font-size: 20px; color: white; border: none; border-radius: 5px; cursor: pointer;">
            <b>WhatsApp</b>
        </button>
    </a>
</div>

<!-- Location Button -->
<div style="padding: 10px; text-align: center;">
    <a id="locationBtn" href="#" style="text-decoration: none;" target="_blank">
        <button style="background-color: blue; width: 90%; height: 50px; font-size: 20px; color: white; border: none; border-radius: 5px; cursor: pointer;">
            <b>Location</b>
        </button>
    </a>
</div>

<script>
  // మీ Google Apps Script Web App URL ని ఇక్కడ గట్టిగా పెట్టండి
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2bvQEmsnzwI_S8BgELzBd-idlQSEbLE_a1nOFVwCDx8yMyyfaqHoZaOI3TLd3XuJmmA/exec";

  window.addEventListener('DOMContentLoaded', (event) => {
    const pathSegments = window.location.pathname.split('/');
    const shopSlug = pathSegments[pathSegments.length - 1];

    if (shopSlug && shopSlug !== "" && shopSlug !== "404.html") {
      fetch(SCRIPT_URL + "?slug=" + shopSlug)
        .then(res => res.json())
        .then(data => {
          if (data.found) {
            document.getElementById("pageTitle").innerText = data.shopName;
            document.getElementById("displayShopName").innerText = data.shopName;
            document.getElementById("displayTagline").innerText = data.tagline || "";
            
            if(data.phone) {
              document.getElementById("callBtn").href = "tel:" + data.phone;
            }
            if(data.whatsapp) {
              document.getElementById("whatsappBtn").href = "https://wa.me/" + data.whatsapp;
            }
            if(data.locationUrl) {
              document.getElementById("locationBtn").href = data.locationUrl;
            }
          } else {
            document.getElementById("displayShopName").innerText = "Shop Not Found";
          }
        })
        .catch(err => {
          console.log("Error:", err);
          document.getElementById("displayShopName").innerText = "Error Loading Shop";
        });
    }
  });
</script>

</body>
</html>
