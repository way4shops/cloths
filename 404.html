<script language="JavaScript">
  // మీ Apps Script Web App URL ని ఇక్కడ పెట్టండి
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2bvQEmsnzwI_S8BgELzBd-idlQSEbLE_a1nOFVwCDx8yMyyfaqHoZaOI3TLd3XuJmmA/exec";
  window.addEventListener('DOMContentLoaded', (event) => {
    const pathSegments = window.location.pathname.split('/');
    const shopSlug = pathSegments[pathSegments.length - 1];

    if (shopSlug && shopSlug !== "" && shopSlug !== "404.html") {
      fetch(SCRIPT_URL + "?slug=" + shopSlug)
        .then(res => res.json())
        .then(data => {
          if (data.found) {
            // 1. పేరు మరియు టైటిల్ మార్చడం
            document.getElementById("pageTitle").innerText = data.shopName;
            document.getElementById("footerShopName").innerText = data.shopName;
            
            // 2. ట్యాగ్‌లైన్ / అడ్రస్ సెట్ చేయడం (ఒకవేళ హెడర్ కింద చూపించాలనుకుంటే)
            // document.getElementById("shopTagline").innerText = data.tagline;

            // 3. కాల్, వాట్సాప్, లొకేషన్ బటన్స్ లింకులు మార్చడం
            if(data.phone) {
              document.getElementById("callBtn").href = "tel:" + data.phone;
              document.getElementById("quoteBtn").href = "sms:" + data.phone + "?body=Hello, send quotation...";
              document.getElementById("orderBtn").href = "sms:" + data.phone + "?body=Hello, I want to order...";
            }
            if(data.whatsapp) {
              document.getElementById("whatsappBtn").href = "https://wa.me/" + data.whatsapp;
            }
            if(data.locationUrl) {
              document.getElementById("locationBtn").href = data.locationUrl;
            }
            
            // 4. యూట్యూబ్ వీడియో మార్చడం
            if(data.youtubeId) {
              document.getElementById("shopVideo").src = "https://www.youtube.com/embed/" + data.youtubeId;
            }

            // 5. వాట్సాప్ షేర్ లింక్
            document.getElementById("shareBtn").href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(data.shopName) + "..Best Offer's...Please Visit Our Site: " + window.location.href;
          } else {
            document.getElementById("footerShopName").innerText = "Shop Not Found";
          }
        })
        .catch(err => {
          console.log("Error fetching shop data", err);
        });
    }
  });

  // రైట్ క్లిక్ & ఇన్‌స్పెక్ట్ లాక్ కోడ్
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); }, false);
  document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) { e.preventDefault(); }
    if (e.keyCode == 83 && (e.platform.match("Mac") ? e.metaKey : e.ctrlKey)) { e.preventDefault(); }
    if (e.ctrlKey && e.keyCode == 85) { e.preventDefault(); }
    if (e.keyCode == 123) { e.preventDefault(); }
  }, false);
</script>
